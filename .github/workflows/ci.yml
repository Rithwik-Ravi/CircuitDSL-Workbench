name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run coverage
        run: npm run coverage

      - name: Verify Verilog with iverilog
        run: npm run verify:verilog

      - name: Build project
        run: npm run build
